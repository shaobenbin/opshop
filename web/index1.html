<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>AppHop | 极致资产管理</title>
	<script src="/static/js/vue.global.js"></script>
	<script src="/static/js/Sortable.min.js"></script>
	<script src="/static/js/vuedraggable.umd.min.js"></script>
	<style>
		:root { --bg: #0a0a0a; --sidebar: #111; --card: #161616; --border: #2a2a2a; --accent: #0078d4; --text: #e0e0e0; --dim: #777; }
		body { font-family: 'JetBrains Mono', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

		/* 侧边栏样式 */
		.sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
		.sidebar-header { padding: 25px; font-weight: bold; font-size: 20px; color: var(--accent); border-bottom: 1px solid var(--border); }
		.sidebar-content { flex: 1; overflow-y: auto; }
		.ws-item { padding: 15px 25px; cursor: pointer; border-left: 4px solid transparent; color: var(--dim); transition: 0.2s; display: flex; align-items: center; }
		.ws-item:hover { background: #1a1a1a; color: white; }
		.ws-item.active { background: #1a1a1a; color: white; border-left-color: var(--accent); font-weight: bold; }
		.sidebar-footer { padding: 15px; border-top: 1px solid var(--border); }

		/* 主界面样式 */
		.main { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; }
		.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; }
		.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 25px; }

		/* 服务器卡片 Node Card */
		.node-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; position: relative; transition: 0.3s; height: fit-content; }
		.node-card:hover { border-color: #444; }
		.node-header { padding: 20px; background: #1d1d1d; border-bottom: 1px solid var(--border); position: relative; cursor: pointer; }
		.node-specs { font-size: 11px; color: #888; margin-top: 8px; font-family: monospace; display: flex; gap: 12px; }
		.node-expiry { font-size: 11px; color: #ff5252; margin-top: 6px; font-weight: bold; }

		/* 编辑按钮 */
		.edit-btn {
			position: absolute; right: 15px; top: 15px; background: #333; color: #fff; border: none;
			padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; opacity: 0; transition: 0.2s; z-index: 10;
		}
		.node-card:hover .edit-btn, .app-item:hover .edit-btn { opacity: 1; }
		.edit-btn:hover { background: var(--accent); }

		/* 应用列表 */
		.app-list { min-height: 50px; padding: 12px; }
		.app-item { background: #222; padding: 16px; border-radius: 10px; margin-bottom: 12px; border: 1px solid transparent; cursor: grab; position: relative; }
		.app-item:hover { border-color: var(--accent); }
		.app-title { font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 4px; }
		.app-meta { font-size: 11px; color: var(--dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

		/* 弹窗及表单 */
		.modal-mask { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center; z-index:9999; }
		.modal-box { background: #1e1e1e; width: 680px; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
		.modal-tabs { display: flex; background: #151515; border-bottom: 1px solid var(--border); }
		.tab-btn { flex: 1; padding: 18px; border: none; background: transparent; color: #666; cursor: pointer; font-weight: bold; font-family: inherit; }
		.tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: #1e1e1e; }
		.modal-body { padding: 30px; max-height: 70vh; overflow-y: auto; }

		.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
		.form-group { margin-bottom: 20px; }
		.form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; }
		.form-group input, .form-group select, .form-group textarea { width: 100%; background: #0c0c0c; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
		.form-group input:focus { border-color: var(--accent); outline: none; }

		.btn { padding: 12px 25px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
		.btn-primary { background: var(--accent); color: white; }
		.btn-cancel { background: #333; color: #999; }
		.btn-ghost { background: transparent; border: 1px dashed #444; color: #666; width: 100%; }
		.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

		.badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 6px; background: #2a2a2a; }
		input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
	</style>
</head>
<body>
<div id="app" style="display: contents;">
	<!-- 侧边栏 -->
	<div class="sidebar">
		<div class="sidebar-header">AppHop 🚀</div>
		<div class="sidebar-content">
			<div v-for="ws in config.workspaces" :key="ws.id"
				 :class="['ws-item', currentWsId === ws.id ? 'active' : '']" @click="currentWsId = ws.id">
				📁 {{ ws.name }}
			</div>
		</div>
		<div class="sidebar-footer">
			<button class="btn btn-primary" style="width: 100%;" @click="addWorkspace">+ 新增空间 (Workspace)</button>
		</div>
	</div>

	<!-- 主内容区 -->
	<div class="main">
		<!-- 未选中或无空间时的欢迎页 -->
		<div v-if="!currentWorkspace" class="empty-state">
			<div style="font-size: 64px; margin-bottom: 20px;">📦</div>
			<h2>欢迎使用 AppHop 资产管理</h2>
			<p>请在左侧选择或创建一个工作空间以开始管理您的服务器</p>
			<button class="btn btn-primary" style="margin-top: 20px; padding: 15px 40px;" @click="addWorkspace">
				立即创建第一个工作空间
			</button>
		</div>

		<!-- 正常显示空间内容 -->
		<template v-else>
			<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
				<div>
					<h1 style="margin:0; font-size: 28px;">{{ currentWorkspace.name }}</h1>
					<p style="color: var(--dim); margin-top: 5px;">当前空间共包含 {{ currentWorkspace.nodes.length }} 台服务器</p>
				</div>
				<button class="btn btn-primary" @click="saveConfig">💾 保存全局配置 (Save)</button>
			</div>

			<div class="grid">
				<!-- 服务器卡片 (Node) -->
				<div v-for="node in currentWorkspace.nodes" :key="node.id" class="node-card">
					<button class="edit-btn" @click="editNode(node)">编辑 (Edit)</button>
					<div class="node-header" @dblclick="editNode(node)">
						<div style="margin-bottom: 10px;">
							<span class="badge" style="color:var(--accent)">{{ node.owner || 'PRIVATE' }}</span>
							<span class="badge" style="color:#ffab40">{{ node.provider || 'Aliyun' }}</span>
						</div>
						<div style="font-size: 18px; font-weight: bold;">{{ node.name }}</div>
						<div class="node-specs">
							<span>🖥️ {{ node.cpu || '?' }}核/{{ node.memory || '?' }}</span>
							<span>🌐 {{ node.ip || '0.0.0.0' }}</span>
							<span>👤 {{ node.user }}</span>
						</div>
						<div v-if="node.expiration" class="node-expiry">📅 到期: {{ node.expiration }}</div>
					</div>

					<!-- 拖拽应用列表 -->
					<draggable class="app-list" v-model="node.apps" group="apps" item-key="id" animation="200">
						<template #item="{element}">
							<div class="app-item" @dblclick.stop="openAppEditor(element)">
								<button class="edit-btn" @click.stop="openAppEditor(element)">编辑</button>
								<div class="app-title">{{ element.name }} <span style="color:var(--accent); float:right;">:{{ element.port || '80' }}</span></div>
								<div class="app-meta">🚀 {{ element.project || 'Default' }} | 🌐 {{ element.domain || '-' }}</div>
								<div class="app-meta" style="color:#555; font-family: monospace;">📍 {{ element.deploy_path }}</div>
							</div>
						</template>
					</draggable>

					<div style="padding: 15px;">
						<button class="btn btn-ghost" @click="addApp(node)">+ 新增应用 (Add App)</button>
					</div>
				</div>

				<!-- 新增服务器入口 -->
				<div class="node-card" @click="addNode" style="display: flex; align-items: center; justify-content: center; min-height: 220px; border: 2px dashed #333; cursor: pointer; background: transparent;">
					<span style="color: #555;">+ 新增服务器 (Add Node)</span>
				</div>
			</div>
		</template>
	</div>

	<!-- 服务器编辑弹窗 (Node Modal) -->
	<div class="modal-mask" v-if="editingNode" @click.self="editingNode = null">
		<div class="modal-box">
			<div style="padding: 30px;">
				<h2 style="margin-top:0; margin-bottom: 25px;">服务器配置 (Server Node)</h2>
				<div class="form-group">
					<label>服务器名称/别名 (Server Name) *</label>
					<input v-model="editingNode.name" placeholder="如: 生产05服务器" autocomplete="off">
				</div>
				<div class="form-row">
					<div class="form-group">
						<label>IP 地址 (IP Address)</label>
						<input v-model="editingNode.ip" placeholder="127.0.0.1" autocomplete="off">
					</div>
					<div class="form-group">
						<label>SSH 登录用户 (User)</label>
						<input v-model="editingNode.user" placeholder="root" autocomplete="off">
					</div>
				</div>
				<div class="form-row">
					<div class="form-group">
						<label>CPU 规格 (Cores)</label>
						<input type="number" v-model.number="editingNode.cpu">
					</div>
					<div class="form-group">
						<label>内存规格 (Memory)</label>
						<input v-model="editingNode.memory" placeholder="8G">
					</div>
				</div>
				<div class="form-row">
					<div class="form-group">
						<label>云厂商 (Provider)</label>
						<select v-model="editingNode.provider">
							<option value="aliyun">Aliyun (阿里云)</option>
							<option value="tencent">Tencent (腾讯云)</option>
							<option value="huawei">Huawei (华为云)</option>
							<option value="local">Local (自建/其他)</option>
						</select>
					</div>
					<div class="form-group">
						<label>到期日期 (Expiration)</label>
						<input type="date" v-model="editingNode.expiration">
					</div>
				</div>
				<div class="form-group">
					<label>归属公司/个人 (Owner)</label>
					<input v-model="editingNode.owner" placeholder="如: A公司" autocomplete="off">
				</div>
				<div class="form-group">
					<label>备注 (Remarks)</label>
					<textarea v-model="editingNode.remarks" rows="2"></textarea>
				</div>
				<div style="display: flex; gap: 15px; margin-top: 10px;">
					<button class="btn btn-primary" @click="saveNodeEdit">确认并保存 (Save)</button>
					<button class="btn btn-cancel" @click="editingNode = null">取消</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 应用编辑弹窗 (App Modal) -->
	<div class="modal-mask" v-if="editingApp" @click.self="editingApp = null">
		<div class="modal-box">
			<div class="modal-tabs">
				<button :class="['tab-btn', activeTab === 1 ? 'active' : '']" @click="activeTab = 1">基本配置</button>
				<button :class="['tab-btn', activeTab === 2 ? 'active' : '']" @click="activeTab = 2">健康检查</button>
				<button :class="['tab-btn', activeTab === 3 ? 'active' : '']" @click="activeTab = 3">高级管理</button>
			</div>
			<div class="modal-body">
				<div v-show="activeTab === 1">
					<div class="form-group"><label>应用名称 (Name) *</label><input v-model="editingApp.name" autocomplete="off"></div>
					<div class="form-group"><label>部署目录 (Deploy Path)</label><input v-model="editingApp.deploy_path" placeholder="/home/server/app/..." autocomplete="off"></div>
					<div class="form-group"><label>外部域名 (Domain)</label><input v-model="editingApp.domain" placeholder="api.example.com" autocomplete="off"></div>
					<div class="form-row">
						<div class="form-group">
							<label>语言 (Lang)</label>
							<select v-model="editingApp.lang">
								<option v-for="l in langOptions" :value="l">{{ l }}</option>
							</select>
						</div>
						<div class="form-group"><label>服务端口 (Port)</label><input type="number" v-model.number="editingApp.port"></div>
					</div>
					<div class="form-group"><label>所属项目 (Project)</label><input v-model="editingApp.project" autocomplete="off"></div>
					<div class="form-group"><label>备注 (Remarks)</label><textarea v-model="editingApp.remarks" rows="2"></textarea></div>
				</div>
				<div v-show="activeTab === 2">
					<div class="form-group"><label>健康检查路径 (URL)</label><input v-model="editingApp.health.url" placeholder="http://127.0.0.1:port/check"></div>
					<div class="form-group"><label>关键字匹配 (Keyword)</label><input v-model="editingApp.health.keyword"></div>
				</div>
				<div v-show="activeTab === 3">
					<div class="form-group"><label>管理脚本 (Manager Script)</label><input v-model="editingApp.manager_script" placeholder="scripts/manager.sh"></div>
				</div>
			</div>
			<div class="btn-row">
				<button class="btn btn-primary" @click="saveAppEdit">确认并保存 (Save)</button>
				<button class="btn btn-cancel" @click="editingApp = null">取消</button>
			</div>
		</div>
	</div>
</div>

<script>
	const { createApp } = Vue;
	const app = createApp({
		components: { 'draggable': window.vuedraggable },
		data() {
			return {
				config: { workspaces: [] },
				currentWsId: null,
				editingApp: null,
				editingNode: null,
				activeTab: 1,
				langOptions: ['Java', 'Uniapp', 'Vue3', 'Python', 'Golang', 'Other'],
				typeOptions: ['api', 'web', 'wap', '独立应用程序', 'web服务应用', '其它']
			}
		},
		computed: {
			currentWorkspace() {
				if (!this.config || !this.config.workspaces) return null;
				return this.config.workspaces.find(ws => ws.id === this.currentWsId) || null;
			}
		},
		mounted() { this.loadConfig(); },
		methods: {
			async loadConfig() {
				try {
					const res = await fetch('/api/config');
					const data = await res.json();
					this.config = data && data.workspaces ? data : { workspaces: [] };
					// 自动选中第一个空间
					if (this.config.workspaces.length > 0 && !this.currentWsId) {
						this.currentWsId = this.config.workspaces[0].id;
					}
				} catch (e) { console.error("加载配置失败", e); }
			},
			async saveConfig() {
				await fetch('/api/config', { method: 'POST', body: JSON.stringify(this.config) });
				console.log("配置已保存");
			},
			addWorkspace() {
				const name = prompt("请输入新工作空间名称 (如: 公司项目):");
				if (name) {
					const id = Date.now().toString();
					this.config.workspaces.push({ id, name, nodes: [] });
					this.currentWsId = id; // 关键：创建后立即选中
					this.saveConfig();
				}
			},
			addNode() {
				if (!this.currentWorkspace) return;
				this.currentWorkspace.nodes.push({
					id: Date.now().toString(), name: "新服务器", ip: "127.0.0.1", user: "root",
					provider: "aliyun", apps: [], cpu: 2, memory: "4G"
				});
			},
			editNode(node) { this.editingNode = JSON.parse(JSON.stringify(node)); },
			saveNodeEdit() {
				const idx = this.currentWorkspace.nodes.findIndex(n => n.id === this.editingNode.id);
				if (idx !== -1) this.currentWorkspace.nodes[idx] = this.editingNode;
				this.editingNode = null;
				this.saveConfig();
			},
			addApp(node) {
				node.apps.push({
					id: Date.now().toString(), name: "新应用", deploy_path: "/home/server",
					port: 8080, project: "", health: {url: "", keyword: ""}
				});
			},
			openAppEditor(app) {
				if (!app.health) app.health = { url: "", keyword: "" };
				this.editingApp = JSON.parse(JSON.stringify(app));
				this.activeTab = 1;
			},
			saveAppEdit() {
				this.currentWorkspace.nodes.forEach(node => {
					const idx = node.apps.findIndex(a => a.id === this.editingApp.id);
					if (idx !== -1) node.apps[idx] = this.editingApp;
				});
				this.editingApp = null;
				this.saveConfig();
			}
		}
	});
	app.mount('#app');
</script>
</body>
</html>
